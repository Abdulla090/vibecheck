name: 🏛️ Muse Autonomous CEO & HR Daily Operations

on:
  schedule:
    # Runs daily at 06:00 UTC (09:00 AM Erbil / Baghdad Time UTC+3)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  executive-ops:
    name: 🎯 Daily Executive Task Dispatch & Health Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🩺 Run Architecture & Build Verification
        run: npm run build

      - name: 🏛️ Execute Muse Autonomous Daily Taskmaster
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/muse-daily-ops.mjs

      - name: 📝 Publish Executive Morning Briefing
        run: |
          echo "### 🏛️ Muse Autonomous Executive Briefing" >> $GITHUB_STEP_SUMMARY
          echo "**Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: Repository healthy, TypeScript & Next.js 15 build validated." >> $GITHUB_STEP_SUMMARY
          echo "**Action Taken**: Checked backlog and assigned non-trivial daily operational directives." >> $GITHUB_STEP_SUMMARY
